<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .profile-container {
            max-width: 600px;
            margin: 0 auto;
        }
        .profile-card {
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .profile-info-group {
            border-bottom: 1px solid #e9ecef;
            padding: 1rem 0;
        }

        .profile-info-group:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: 600;
            color: #667eea;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 1.1rem;
            color: #333;
            margin-top: 0.25rem;
        }

        .badge-role {
            font-size: 0.875rem;
            padding: 0.5rem 1rem;
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
            margin-top: 2rem;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
        }

        .error-message {
            display: none;
        }
    </style>
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">LMS</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="dashboardLink">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="profile.html">Profile</a>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container profile-container mt-4 mb-4">
        <div id="loadingSpinner" class="loading">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div id="errorMessage" class="alert alert-danger alert-dismissible fade show error-message" role="alert">
            <strong>Error!</strong> <span id="errorText"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div id="profileContent" class="profile-card card" style="display: none;">
            <div class="card-body p-4">
                <div class="mb-4">
                    <h5 class="mb-3">Personal Information</h5>
                    
                    <div class="profile-info-group">
                        <div class="info-label">First Name</div>
                        <div class="info-value" id="firstName">-</div>
                    </div>

                    <div class="profile-info-group">
                        <div class="info-label">Last Name</div>
                        <div class="info-value" id="lastName">-</div>
                    </div>

                    <div class="profile-info-group">
                        <div class="info-label">Email</div>
                        <div class="info-value" id="email">-</div>
                    </div>

                    <div class="profile-info-group">
                        <div class="info-label">Username</div>
                        <div class="info-value" id="username">-</div>
                    </div>
                </div>
                <div class="mb-4">
                    <h5 class="mb-3">Role & Organization</h5>

                    <div class="profile-info-group">
                        <div class="info-label">Role</div>
                        <div class="info-value">
                            <span id="roleBadge" class="badge badge-role bg-primary">Loading...</span>
                        </div>
                    </div>

                    <div class="profile-info-group">
                        <div class="info-label">Department</div>
                        <div class="info-value" id="department">-</div>
                    </div>

                    <div class="profile-info-group">
                        <div class="info-label">Level</div>
                        <div class="info-value" id="level">-</div>
                    </div>
                </div>
                <div class="action-buttons">
                    <a href="#" class="btn btn-primary" id="changePasswordBtn">Change Password</a>
                    <a href="#" class="btn btn-secondary" id="backBtn">Back</a>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="changePasswordModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Change Password</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="changePasswordForm">
                        <div class="mb-3">
                            <label class="form-label">Current Password</label>
                            <input type="password" class="form-control" id="oldPassword" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">New Password</label>
                            <input type="password" class="form-control" id="newPassword" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Confirm New Password</label>
                            <input type="password" class="form-control" id="confirmPassword" required>
                        </div>
                        <div id="passwordError" class="alert alert-danger d-none"></div>
                        <button type="submit" class="btn btn-primary w-100">Update Password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/profile.js"></script>
</body>

</html>
