<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">LMS - Instructor</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active" href="instructor_dashboard.html">Courses</a></li>
                    <li class="nav-item"><a class="nav-link" href="instructor_enrollments.html">Enrollments</a></li>
                    <li class="nav-item"><a class="nav-link" href="instructor_assignments.html">Assignments</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
                </ul>
            </div>
            <div class="d-flex">
                <button class="btn btn-outline-light" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>My Courses</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#courseModal">Create New
                Course</button>
        </div>

        <div class="row" id="instructor-courses-list">
           
        </div>
    </div>


    <div class="modal fade" id="courseModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="courseModalLabel">Create Course</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="course-form">
                        <input type="hidden" id="course-id">
                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" id="course-title" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea id="course-description" class="form-control" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tags (comma separated)</label>
                            <input type="text" id="course-tags" class="form-control" placeholder="e.g., Python, Web Development">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Allowed Departments (comma separated IDs)</label>
                            <input type="text" id="course-depts" class="form-control" placeholder="e.g., 1,2,3">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Allowed Levels (comma separated IDs)</label>
                            <input type="text" id="course-levels" class="form-control" placeholder="e.g., 1,2,3">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Topics</label>
                            <div id="topics-container"></div>
                            <button type="button" class="btn btn-sm btn-secondary mt-2" onclick="addTopicField()">Add Topic</button>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Save Course</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/instructor.js"></script>

</body>

</html>
