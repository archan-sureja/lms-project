<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Assignments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">LMS - Instructor</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="instructor_dashboard.html">Courses</a></li>
                    <li class="nav-item"><a class="nav-link" href="instructor_enrollments.html">Enrollments</a></li>
                    <li class="nav-item"><a class="nav-link active" href="instructor_assignments.html">Assignments</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
                </ul>
            </div>
            <div class="d-flex">
                <button class="btn btn-outline-light" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Manage Assignments</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#assignmentModal"
                onclick="resetAssignmentForm()">Create Assignment</button>
        </div>

        <ul class="nav nav-tabs" id="assignTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="assignments-tab" data-bs-toggle="tab" data-bs-target="#assignments"
                    type="button" role="tab">Assignments</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="submissions-tab" data-bs-toggle="tab" data-bs-target="#submissions"
                    type="button" role="tab">Submissions to Grade</button>
            </li>
        </ul>

        <div class="tab-content bg-white border border-top-0 p-4" id="assignTabsContent">
            <div class="tab-pane fade show active" id="assignments" role="tabpanel">
                <div class="row" id="assignments-list">
                </div>
            </div>
            <div class="tab-pane fade" id="submissions" role="tabpanel">
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Submission ID</th>
                                <th>Assignment</th>
                                <th>User</th>
                                <th>File</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="submissions-table-body">

                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

            <div class="tab-content bg-white border border-top-0 p-4" id="assignTabsContent">
            <div class="tab-pane fade show active" id="grades" role="tabpanel">
                <div class="row" id="grades-list">
                </div>
            </div>
            <div class="tab-pane fade" id="grades" role="tabpanel">
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Submission</th>
                                <th>Review Text</th>
                                <th>Grade (out of 10)</th>
                                <th>Graded At</th>

                            </tr>
                        </thead>
                        <tbody id="grades-table-body">

                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>


    <div class="modal fade" id="assignmentModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create/Update Assignment</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="assignment-form">
                        <input type="hidden" id="assign-id">
                        <div class="mb-3">
                            <label class="form-label">Course ID</label>
                            <input type="number" id="assign-course-id" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" id="assign-title" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea id="assign-desc" class="form-control" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Deadline</label>
                            <input type="datetime-local" id="assign-deadline" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Save Assignment</button>
                    </form>
                </div>
            </div>
        </div>
    </div>


    <div class="modal fade" id="gradeModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Grade Submission</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="grade-form">
                        <input type="hidden" id="grade-sub-id">
                        <div class="mb-3">
                            <label class="form-label">Score</label>
                            <input type="number" id="grade-score" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Feedback</label>
                            <textarea id="grade-feedback" class="form-control"></textarea>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Submit Grade</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/instructor.js"></script>

</body>

</html>
